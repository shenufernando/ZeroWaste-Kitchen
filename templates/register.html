{% extends "base.html" %}

{% block title %}Register - ZeroWaste Kitchen{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 rounded-3">
                <div class="card-body p-4 p-sm-5">
                    <h3 class="card-title text-center fw-bold mb-4 text-success">Create Your Account</h3>
                    
                    <form action="{{ url_for('register') }}" method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label font-weight-bold">Full Name</label>
                            <input type="text" class="form-control" id="name" name="name" placeholder="John Doe" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label font-weight-bold">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                        </div>
                        
                        <!-- Password Field with Show/Hide Toggle -->
                        <div class="mb-3">
                            <label for="password" class="form-label font-weight-bold">Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                                <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                    <i class="bi bi-eye" id="toggleIcon"></i>
                                </button>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="plan_type" class="form-label font-weight-bold">Select Plan</label>
                            <select class="form-select" id="plan_type" name="plan_type">
                                <option value="Free" selected>Free Plan (Basic Inventory & AI Recipes)</option>
                                <option value="Pro">Pro Plan (Unlimited Recipes & Nutrition Analytics)</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2 fw-bold shadow-sm">Register</button>
                    </form>

                    <hr class="my-4">

                    <div class="text-center">
                        <p class="mb-0 text-muted">Already have an account? <a href="{{ url_for('login') }}" class="text-success fw-bold">Log In</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('togglePassword').addEventListener('click', function () {
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggleIcon');
        
           // Toggle the password to be visible/invisible
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleIcon.classList.remove('bi-eye');
            toggleIcon.classList.add('bi-eye-slash');
        } else {
            passwordInput.type = 'password';
            toggleIcon.classList.remove('bi-eye-slash');
            toggleIcon.classList.add('bi-eye');
        }
    });
</script>
{% endblock %}
